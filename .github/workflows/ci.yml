name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No step in this workflow is allowed to soft-fail: a test failure or a lint
# error fails the run. Nothing here uses continue-on-error or `|| true`.

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/unit -v --cov=backend --cov-report=term-missing

      # GitHub sets CI=true, which makes tests/conftest.py fail rather than skip
      # when the Supabase credentials are missing — an unconfigured secret must
      # not turn the integration suite into a silent no-op.
      - name: Run integration tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: pytest tests/integration -v --cov=backend --cov-report=term-missing

      - name: Lint with ruff
        run: ruff check .

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only — no registry push. This job exists to catch a Dockerfile
      # or dependency change that breaks the image build.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nuvilog-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
