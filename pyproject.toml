[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
# Coverage that matters here is on the pipeline stages, not on the venv that
# happens to live inside backend/.
source = ["backend"]
omit = [
    "backend/venv/*",
    "backend/data/samples/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["backend/venv", "frontend", ".git"]

[tool.ruff.lint]
# Ruff's default correctness set (pycodestyle errors + pyflakes) plus import
# sorting. Deliberately not enabling the stylistic/modernization rules (UP, B):
# CI fails hard on any lint error, and those would demand a rewrite of existing
# pipeline code that has nothing to do with the change being linted.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# The app runs with backend/ as the working directory, so its own packages are
# imported as top-level names and would otherwise be sorted as third-party.
known-first-party = ["main", "models", "pipeline"]
